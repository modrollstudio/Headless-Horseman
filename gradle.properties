# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Mod metadata
mod_id=critfall_horseman
mod_name=Critfall: Headless Horseman
mod_version=0.1.1
mod_group=studio.modroll.horseman
# Jars are <archives_name>-<loader>-<version>.jar.
archives_name=critfall-horseman
mod_authors=NightsHigh, Modroll Studio
mod_description=A Halloween boss for Critfall: a headless rider who comes at midnight on October nights.
mod_license=MIT
mod_issue_tracker=https://github.com/modrollstudio/Headless-Horseman/issues

# Critfall dependency — resolved from the Modrinth maven as maven.modrinth:critfall:<id>.
# Critfall uploads one Modrinth version per loader (`<version>+neoforge` / `+fabric`), so each
# loader's jar is pinned by its opaque Modrinth version id. Bump both ids with every Critfall release.
critfall_version=0.2.17
critfall_neoforge_modrinth_id=vsIyLI86
critfall_fabric_modrinth_id=3up3C5YK
critfall_min_version=0.2.17
critfall_version_range=[0.2.17,)

# GeckoLib dependency — from the Modrinth maven too, one pinned version id per loader.
# Bump both ids with every GeckoLib update.
geckolib_version=4.9.3
geckolib_neoforge_modrinth_id=Grwn5rUB
geckolib_fabric_modrinth_id=tmxM7U4W
geckolib_min_version=4.9.3
geckolib_version_range=[4.9.3,)

# Checks soft dependency: the Horseman never calls it. With Checks installed, Critfall asks it for a player's
# Dexterity save, so it goes on the dev runs (off with -PwithoutChecks) and the GameTests roll both ways.
# Pinned like Critfall, by each loader's Modrinth version id (maven.modrinth:critfall-checks:<id>). Checks has no Modrinth
# versions yet, so while a loader's id is empty its jar comes from CurseForge through CurseMaven instead, as
# curse.maven:critfall-checks-<project>:<file id>, pinned by the CurseForge ids below.
checks_version=0.1.3
checks_neoforge_modrinth_id=
checks_fabric_modrinth_id=
checks_curseforge_project_id=1735843
checks_neoforge_curseforge_file_id=9279624
checks_fabric_curseforge_file_id=9279620
checks_min_version=0.1.3
checks_version_range=[0.1.3,)

# Initiative soft dependency: the Horseman never calls it, only tags himself and his steed never_joins. It is on the dev
# runs only with -PwithInitiative, never in tools/test-all.sh. Its jar comes from CurseForge through CurseMaven, as
# curse.maven:critfall-initiative-<project>:<file id>, pinned by each loader's file id.
initiative_version=0.2.0
initiative_curseforge_project_id=1713036
initiative_neoforge_curseforge_file_id=9280564
initiative_fabric_curseforge_file_id=9280559
initiative_min_version=0.2.0
initiative_version_range=[0.2.0,)

# Mod Menu 11.0.3 (Modrinth version id): optional on Fabric, opens the config screen from its mod list.
modmenu_modrinth_id=YIfqIJ8q

# Platform versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neoform_version=1.21.1-20240808.144430
neoforge_version=21.1.235
# GeckoLib needs NeoForge 21.1.150 or newer.
neoforge_version_range=[21.1.150,)

# Fabric
fabric_loom_version=1.17-SNAPSHOT
# GeckoLib needs Fabric Loader 0.17 or newer.
fabric_loader_version=0.17.3
fabric_api_version=0.109.0+1.21.1

# Tooling
java_version=21
junit_version=5.11.4
